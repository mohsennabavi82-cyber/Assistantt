<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>LIFEOS — داشبورد شخصی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #070b1e;
    --bg2: #0b1130;
    --panel: #111838;
    --panel2: #161f48;
    --line: #26306a;
    --ink: #e9edff;
    --muted: #93a0d0;
    --purple: #6d4aff;
    --purple2: #8b6bff;
    --blue: #2f6bff;
    --green: #17d9a0;
    --amber: #f29b1d;
    --red: #ff6b7a;
    --focus: #8ab4f8;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(1200px 600px at 80% -10%, #1a2370 0%, transparent 60%), var(--bg);
    color: var(--ink);
    font-family: "Vazirmatn", Tahoma, "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.7;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  [hidden] { display: none !important; }
  svg { display: block; }

  /* ---------- layout ---------- */
  .app { display: grid; grid-template-columns: 250px 1fr; min-height: 100vh; }
  .side {
    position: sticky; top: 0; height: 100vh;
    background: linear-gradient(180deg, #0c1233, #080c26);
    border-inline-start: 1px solid var(--line);
    display: flex; flex-direction: column; padding: 22px 16px;
  }
  .brand { text-align: center; margin-bottom: 22px; }
  .brand svg { margin: 0 auto 6px; }
  .brand b { display: block; font-size: 26px; letter-spacing: 1px; font-weight: 800; }
  .brand small { color: var(--muted); font-size: 12px; direction: ltr; display: block; }
  nav { display: flex; flex-direction: column; gap: 6px; }
  .nav-btn {
    display: flex; align-items: center; gap: 12px;
    background: transparent; border: 0; border-radius: 12px;
    padding: 11px 14px; color: var(--muted); text-align: start; min-height: 46px;
  }
  .nav-btn svg { width: 22px; height: 22px; flex: none; }
  .nav-btn:hover { background: rgba(109, 74, 255, .12); color: var(--ink); }
  .nav-btn[aria-current="page"] { background: linear-gradient(90deg, #5a3df0, #7c5cff); color: #fff; box-shadow: 0 6px 24px rgba(109, 74, 255, .35); }
  .side-foot { margin-top: auto; border-top: 1px solid var(--line); padding-top: 16px; }
  .me { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .avatar {
    width: 44px; height: 44px; border-radius: 50%; flex: none;
    background: linear-gradient(135deg, var(--purple), var(--blue));
    display: grid; place-items: center; font-weight: 800; font-size: 18px;
  }
  .me b { display: block; line-height: 1.3; overflow-wrap: anywhere; }
  .me span { font-size: 12px; color: var(--green); }
  .ver { text-align: center; color: var(--muted); font-size: 12px; margin-top: 10px; direction: ltr; }

  main { padding: 20px 24px 40px; min-width: 0; }
  .top { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
  .bell {
    position: relative; width: 44px; height: 44px; flex: none;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    display: grid; place-items: center;
  }
  .bell svg { width: 22px; height: 22px; }
  .badge {
    position: absolute; top: -6px; inset-inline-end: -6px;
    min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px;
    background: var(--red); color: #fff; font-size: 12px; display: grid; place-items: center; font-weight: 600;
  }
  .when { flex: none; line-height: 1.4; font-size: 14px; }
  .when small { color: var(--muted); display: block; }
  .search { position: relative; flex: 1; max-width: 520px; margin-inline: auto; }
  .search #q {
    width: 100%; height: 46px; border-radius: 23px; padding-inline: 56px 18px;
    background: var(--panel); border: 1px solid var(--line);
  }
  .search svg { position: absolute; inset-inline-start: 18px; top: 12px; width: 22px; height: 22px; color: var(--muted); pointer-events: none; }
  .results {
    position: absolute; z-index: 30; top: 52px; inset-inline: 0;
    background: var(--panel2); border: 1px solid var(--line); border-radius: 14px;
    max-height: 340px; overflow: auto; padding: 6px;
    box-shadow: 0 18px 40px rgba(0, 0, 0, .5);
  }
  .results button { display: block; width: 100%; text-align: start; background: transparent; border: 0; padding: 9px 12px; border-radius: 10px; }
  .results button:hover { background: rgba(109, 74, 255, .18); }
  .results small { color: var(--muted); display: block; }

  .grid { display: grid; gap: 16px; grid-template-columns: repeat(12, 1fr); }
  .card {
    background: linear-gradient(160deg, var(--panel2), var(--panel));
    border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; min-width: 0;
  }
  .card h2 { margin: 0 0 12px; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .card h2 .ttl { display: flex; align-items: center; gap: 8px; }
  .card h2 svg { width: 22px; height: 22px; color: var(--blue); }
  .link { background: none; border: 0; color: var(--blue); font-size: 13px; padding: 4px 6px; border-radius: 8px; }
  .c-progress { grid-column: span 3; text-align: center; }
  .c-banner { grid-column: span 9; position: relative; overflow: hidden; min-height: 210px; padding: 0; border: 1px solid var(--line); }
  .c-quick { grid-column: span 3; }
  .c-cal { grid-column: span 5; }
  .c-today { grid-column: span 4; }
  .c-status { grid-column: span 4; }
  .c-recent { grid-column: span 4; }
  .c-week { grid-column: span 4; }

  /* banner */
  .banner-art { position: absolute; inset: 0; }
  .banner-text { position: relative; padding: 30px 28px; max-width: 60%; margin-inline-end: auto; }
  .banner-text h1 { margin: 0 0 6px; font-size: 28px; font-weight: 800; }
  .banner-text p { margin: 0 0 18px; color: #d9defa; }
  .primary {
    background: linear-gradient(90deg, #5a3df0, #7c5cff); color: #fff; border: 0; border-radius: 12px;
    padding: 10px 20px; min-height: 44px; font-weight: 600; box-shadow: 0 8px 24px rgba(109, 74, 255, .4);
  }
  .ghost { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; min-height: 40px; }
  .danger { color: var(--red); }
  button:disabled { opacity: .55; cursor: not-allowed; }

  /* progress */
  .ring { width: 130px; height: 130px; margin: 6px auto 8px; position: relative; }
  .ring svg { width: 130px; height: 130px; transform: rotate(-90deg); }
  .ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 28px; font-weight: 800; }
  .muted { color: var(--muted); }
  .sm { font-size: 13px; }

  /* quick actions */
  .quick { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .q {
    border: 0; border-radius: 14px; min-height: 96px; padding: 12px 8px; color: #fff; font-weight: 600;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  }
  .q svg { width: 28px; height: 28px; }
  .q.a { background: linear-gradient(145deg, #7a4dff, #5230d8); }
  .q.b { background: linear-gradient(145deg, #2f6bff, #1746c9); }
  .q.c { background: linear-gradient(145deg, #1fc79a, #0f8f78); }
  .q.d { background: linear-gradient(145deg, #f5a623, #c97a0c); }

  /* calendar */
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .cal-head b { font-size: 16px; }
  .iconbtn { width: 38px; height: 38px; background: transparent; border: 1px solid transparent; border-radius: 10px; display: grid; place-items: center; color: var(--muted); }
  .iconbtn:hover { border-color: var(--line); color: var(--ink); }
  .iconbtn svg { width: 20px; height: 20px; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
  .cal .dow { color: var(--muted); font-size: 13px; padding: 4px 0; }
  .day {
    position: relative; aspect-ratio: 1 / 1; max-height: 48px; border: 0; border-radius: 50%;
    background: transparent; display: grid; place-items: center; font-size: 14px; min-width: 32px;
  }
  .day:hover { background: rgba(109, 74, 255, .18); }
  .day.today { background: var(--purple); color: #fff; font-weight: 600; }
  .day.sel { outline: 2px solid var(--blue); }
  .day i { position: absolute; bottom: 3px; left: 50%; width: 5px; height: 5px; border-radius: 50%; background: var(--green); transform: translateX(-50%); }
  .day i.open { background: var(--amber); }
  .big .day { aspect-ratio: auto; max-height: none; min-height: 58px; border-radius: 12px; align-content: start; padding-top: 8px; border: 1px solid transparent; }
  .big .day.today { background: rgba(109, 74, 255, .3); border-color: var(--purple); }
  .big .day em { font-style: normal; font-size: 11px; color: var(--muted); display: block; }

  /* tasks */
  .list { list-style: none; margin: 0; padding: 0; }
  .task { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
  .task:first-child { border-top: 0; }
  .task .t { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .task .t small { color: var(--muted); display: block; font-size: 12px; }
  .task.done .t b { text-decoration: line-through; color: var(--muted); font-weight: 400; }
  .check { width: 28px; height: 28px; border-radius: 50%; flex: none; border: 2px solid #5a67a8; background: transparent; display: grid; place-items: center; padding: 0; }
  .check.on { background: var(--green); border-color: var(--green); color: #06251d; }
  .check svg { width: 16px; height: 16px; }
  .chip { display: inline-block; font-size: 11px; padding: 0 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); margin-inline-end: 4px; line-height: 1.7; }
  .chip.urgent { color: var(--red); border-color: var(--red); }
  .chip.high { color: var(--amber); border-color: var(--amber); }
  .chip.rem { color: var(--purple2); border-color: var(--purple2); }
  .chip.late { color: var(--red); border-color: var(--red); }
  .empty { color: var(--muted); padding: 14px 0; text-align: center; }

  /* status / activity / week */
  .conn { display: grid; gap: 10px; }
  .conn div { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; background: rgba(255, 255, 255, .04); border: 1px solid var(--line); border-radius: 12px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--amber); margin-inline-end: 6px; }
  .dot.on { background: var(--green); }
  .feed { list-style: none; margin: 0; padding: 0; }
  .feed li { display: flex; gap: 12px; padding: 8px 0; align-items: flex-start; }
  .feed .ic { width: 34px; height: 34px; border-radius: 50%; flex: none; display: grid; place-items: center; background: rgba(109, 74, 255, .2); color: var(--purple2); }
  .feed .ic svg { width: 18px; height: 18px; }
  .feed small { color: var(--muted); display: block; font-size: 12px; }
  .week { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stat { border-radius: 14px; padding: 12px 14px; border: 1px solid transparent; }
  .stat b { display: block; font-size: 26px; line-height: 1.2; }
  .stat span { font-size: 13px; color: #dfe4ff; }
  .stat.s1 { background: linear-gradient(145deg, #173a9a, #102a72); }
  .stat.s2 { background: linear-gradient(145deg, #5a2fb8, #3b1f86); }
  .stat.s3 { background: linear-gradient(145deg, #0e7a63, #0a5446); }
  .stat.s4 { background: linear-gradient(145deg, #a8660c, #7a4806); }

  /* pages */
  .page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .page-head h1 { margin: 0; font-size: 24px; }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .tab { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 16px; min-height: 38px; }
  .tab[aria-pressed="true"] { background: var(--purple); border-color: var(--purple); color: #fff; }
  .notes { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .note p { margin: 0 0 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .note footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 12px; }
  .bars { display: flex; align-items: flex-end; gap: 10px; height: 160px; padding-top: 10px; }
  .bars div { flex: 1; text-align: center; font-size: 12px; color: var(--muted); display: flex; flex-direction: column; justify-content: flex-end; height: 100%; }
  .bars span { display: block; background: linear-gradient(180deg, var(--purple2), var(--blue)); border-radius: 8px 8px 2px 2px; min-height: 3px; margin-bottom: 4px; }
  .bars b { color: var(--ink); font-weight: 600; }
  .code { direction: ltr; text-align: left; font-family: ui-monospace, Menlo, Consolas, monospace; word-break: break-all; user-select: all; background: var(--bg); border: 1px dashed var(--purple2); border-radius: 10px; padding: 12px; margin-top: 10px; }

  /* login */
  .login { max-width: 420px; margin: 12vh auto 0; padding: 0 16px; }
  .login .card { padding: 26px; }
  label { display: block; font-weight: 600; margin: 12px 0 6px; font-size: 14px; }
  input[type="text"], input[type="email"], input[type="time"], select, textarea {
    width: 100%; min-height: 44px; padding: 8px 12px; border-radius: 10px;
    background: var(--bg2); border: 1px solid var(--line);
  }
  textarea { min-height: 110px; resize: vertical; }
  input[type="email"] { direction: ltr; text-align: left; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }

  /* modal + toast */
  .overlay { position: fixed; inset: 0; z-index: 50; background: rgba(3, 6, 20, .7); display: grid; place-items: center; padding: 16px; }
  .dialog { width: 100%; max-width: 460px; max-height: 92vh; overflow: auto; background: var(--panel2); border: 1px solid var(--line); border-radius: 18px; padding: 20px; box-shadow: 0 30px 80px rgba(0, 0, 0, .6); }
  .dialog h3 { margin: 0 0 6px; font-size: 19px; }
  .dialog .err { color: var(--red); min-height: 22px; font-size: 14px; }
  .dialog .btns { display: flex; gap: 10px; justify-content: flex-start; margin-top: 8px; }
  .pick { display: grid; gap: 10px; margin-top: 10px; }
  .pick button { text-align: start; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-height: 52px; }
  #toasts { position: fixed; z-index: 60; inset-inline: 0; bottom: 18px; display: grid; justify-items: center; gap: 8px; pointer-events: none; }
  .toast { background: #1d2760; border: 1px solid var(--line); border-radius: 12px; padding: 10px 18px; max-width: 90vw; box-shadow: 0 10px 30px rgba(0, 0, 0, .5); }
  .toast.err { border-color: var(--red); }
  .toast.good { border-color: var(--green); }

  /* responsive */
  @media (max-width: 1100px) {
    .c-progress { grid-column: span 4; }
    .c-banner { grid-column: span 8; }
    .c-quick, .c-cal, .c-today, .c-status, .c-recent, .c-week { grid-column: span 6; }
  }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; padding-bottom: 76px; }
    .side {
      position: fixed; inset: auto 0 0 0; top: auto; height: auto; z-index: 40;
      flex-direction: row; padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); border-inline-start: 0; border-top: 1px solid var(--line);
    }
    .brand, .side-foot { display: none; }
    nav { flex-direction: row; width: 100%; justify-content: space-around; gap: 2px; }
    .nav-btn { flex-direction: column; gap: 2px; padding: 6px 4px; font-size: 11px; min-height: 52px; flex: 1; text-align: center; justify-content: center; }
    .nav-btn span { max-width: 64px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    main { padding: 14px 14px 30px; }
    .when { display: none; }
    .c-progress, .c-banner, .c-quick, .c-cal, .c-today, .c-status, .c-recent, .c-week { grid-column: 1 / -1; }
    .banner-text { max-width: 100%; padding: 22px 18px; }
    .banner-art { opacity: .55; }
    .banner-text h1 { font-size: 23px; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .nav-btn, .day, .q, .primary { transition: background-color .15s, transform .15s; }
    .q:hover, .primary:hover { transform: translateY(-1px); }
  }
</style>
</head>
<body>

<div id="login" class="login" hidden>
  <div class="card">
    <div class="brand">
      <svg width="64" height="40" viewBox="0 0 64 40" aria-hidden="true"><defs><linearGradient id="lg0" x1="0" x2="1"><stop offset="0" stop-color="#2dd4ff"/><stop offset="1" stop-color="#8b5cff"/></linearGradient></defs><path d="M20 8c-7 0-12 5-12 12s5 12 12 12c9 0 15-24 24-24 7 0 12 5 12 12s-5 12-12 12c-9 0-15-24-24-24z" fill="none" stroke="url(#lg0)" stroke-width="6" stroke-linecap="round"/></svg>
      <b>LIFEOS</b>
      <small>Your Personal AI Assistant</small>
    </div>
    <p class="muted sm">ایمیلتان را بنویسید تا لینک ورود برایتان فرستاده شود. فقط حساب‌هایی که دعوت شده‌اند می‌توانند وارد شوند.</p>
    <label for="email">ایمیل</label>
    <input id="email" type="email" autocomplete="email" inputmode="email" placeholder="name@example.com">
    <div style="margin-top:14px"><button class="primary" id="send-link" type="button">ارسال لینک ورود</button></div>
    <p id="login-msg" class="sm" role="status" aria-live="polite" style="min-height:24px;margin:10px 0 0"></p>
  </div>
</div>

<div id="app" class="app" hidden>
  <aside class="side">
    <div class="brand">
      <svg width="64" height="40" viewBox="0 0 64 40" aria-hidden="true"><defs><linearGradient id="lg1" x1="0" x2="1"><stop offset="0" stop-color="#2dd4ff"/><stop offset="1" stop-color="#8b5cff"/></linearGradient></defs><path d="M20 8c-7 0-12 5-12 12s5 12 12 12c9 0 15-24 24-24 7 0 12 5 12 12s-5 12-12 12c-9 0-15-24-24-24z" fill="none" stroke="url(#lg1)" stroke-width="6" stroke-linecap="round"/></svg>
      <b>LIFEOS</b>
      <small>Your Personal AI Assistant</small>
    </div>
    <nav id="nav" aria-label="بخش‌ها"></nav>
    <div class="side-foot">
      <div class="me"><div class="avatar" id="avatar" aria-hidden="true"></div><div><b id="me-name"></b><span>● آنلاین</span></div></div>
      <button class="nav-btn" id="logout" type="button"><span id="logout-ic"></span><span>خروج</span></button>
      <div class="ver">LIFEOS v1.1.0</div>
    </div>
  </aside>
  <main>
    <div class="top">
      <button class="bell" id="bell" type="button" aria-label="کارهای امروز و عقب‌افتاده"><span id="bell-ic"></span><span class="badge" id="bell-n" hidden></span></button>
      <div class="when" id="when"></div>
      <div class="search">
        <span id="search-ic"></span>
        <input id="q" type="text" placeholder="جستجو در کارها و یادداشت‌ها…" autocomplete="off" aria-label="جستجو">
        <div class="results" id="results" hidden></div>
      </div>
    </div>
    <div id="view"></div>
  </main>
</div>
<div id="toasts" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.80.0/dist/umd/supabase.min.js"></script>

    window.scrollTo(0, 0);
  }
  function renderNav() {
    var nav = $("nav"); clear(nav);
    ROUTES.forEach(function (r) {
      nav.append(h("button", { class: "nav-btn", type: "button", "aria-current": state.route === r[0] ? "page" : null, onclick: function () { go(r[0]); } }, icon(r[2]), h("span", { text: r[1] })));
    });
  }
  function setChrome() {
    var n = displayName();
    $("me-name").textContent = n || "کاربر";
    $("avatar").textContent = (n || "؟").slice(0, 1);
    var j = jal(new Date()), p = tehran(new Date());
    var dow = dowOf(new Date());
    $("when").textContent = "";
    $("when").append(document.createTextNode(dow + "، " + fa(j.jd) + " " + MONTHS[j.jm - 1] + " " + fa(j.jy)), h("small", { text: "ساعت " + fa(p2(p.hh) + ":" + p2(p.mm)) }));
  }
  function render() {
    renderNav();
    var st = stats(), n = st.overdue.length + st.dueToday.length;
    $("bell-n").hidden = n === 0; $("bell-n").textContent = fa(n);
    var view = $("view"); clear(view);
    var map = { dashboard: viewDashboard, tasks: viewTasks, calendar: viewCalendar, memory: viewMemory, reports: viewReports, settings: viewSettings };
    view.append((map[state.route] || viewDashboard)());
  }

  // ===== search =====
  function runSearch() {
    var q = $("q").value.trim().toLowerCase(), box = $("results");
    state.query = q.length >= 2 ? q : "";
    if (q.length < 2) { box.hidden = true; clear(box); if (state.route === "tasks" || state.route === "memory") render(); return; }
    var tasks = state.tasks.filter(function (t) { return t.title.toLowerCase().indexOf(q) !== -1; }).slice(0, 5);
    var notes = state.notes.filter(function (m) { return m.content.toLowerCase().indexOf(q) !== -1; }).slice(0, 5);
    clear(box); box.hidden = false;
    if (!tasks.length && !notes.length) { box.append(h("div", { class: "empty", text: "چیزی پیدا نشد." })); return; }
    tasks.forEach(function (t) { box.append(h("button", { type: "button", onclick: function () { box.hidden = true; state.taskFilter = "all"; go("tasks"); } }, h("span", { text: t.title }), h("small", { text: "کار" + (t.due_at ? " · " + fmtDue(t.due_at) : "") }))); });
    notes.forEach(function (m) { box.append(h("button", { type: "button", onclick: function () { box.hidden = true; state.noteFilter = "all"; go("memory"); } }, h("span", { text: m.content.length > 70 ? m.content.slice(0, 70) + "…" : m.content }), h("small", { text: "یادداشت" }))); });
  }

  // ===== login and start =====
  async function showApp() {
    $("login").hidden = true; $("app").hidden = false;
    $("logout-ic").append(icon("logout")); $("bell-ic").append(icon("bell")); $("search-ic").append(icon("search"));
    var jn = jal(new Date());
    state.calY = jn.jy; state.calM = jn.jm;
    setChrome(); render();
    try { await Promise.all([loadAll(), loadLink()]); } catch (e) { toast("بارگذاری داده‌ها انجام نشد. صفحه را دوباره باز کنید.", "err"); }
    render();
    setInterval(setChrome, 30000);
  }
  function showLogin() { $("app").hidden = true; $("login").hidden = false; }

  $("send-link").addEventListener("click", async function () {
    var email = $("email").value.trim(), out = $("login-msg"), btn = $("send-link");
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { out.textContent = "ایمیل معتبر وارد کنید."; out.style.color = "var(--red)"; return; }
    btn.disabled = true; out.textContent = "";
    var res = await sb.auth.signInWithOtp({ email: email, options: { shouldCreateUser: false, emailRedirectTo: window.location.origin + window.location.pathname } });
    btn.disabled = false;
    if (res.error && res.error.status === 429) { out.textContent = "تعداد درخواست‌ها زیاد است. چند دقیقه بعد دوباره امتحان کنید."; out.style.color = "var(--red)"; return; }
    out.textContent = "اگر این ایمیل دعوت شده باشد، لینک ورود به آن فرستاده شد. صندوق ایمیل (و پوشهٔ هرزنامه) را ببینید.";
    out.style.color = "var(--green)";
  });
  $("logout").addEventListener("click", async function () { await sb.auth.signOut(); });
  $("bell").addEventListener("click", function () { state.taskFilter = "today"; go("tasks"); });
  $("q").addEventListener("input", runSearch);
  document.addEventListener("click", function (e) { if (!e.target.closest(".search")) $("results").hidden = true; });
  sb.auth.onAuthStateChange(function (event) { if (event === "SIGNED_OUT") { state.user = null; showLogin(); } });

  (async function init() {
    var s = (await sb.auth.getSession()).data.session;
    if (!s) { showLogin(); return; }
    state.user = s.user;
    var want = (location.hash || "").replace("#", "");
    if (ROUTES.some(function (r) { return r[0] === want; })) state.route = want;
    await showApp();
  })();

  // Exposed only so the date helpers can be checked from a test harness.
  window.__lifeosTest = { toJalali: toJalali, toGregorian: toGregorian, monthLen: monthLen };
})();
</script>
